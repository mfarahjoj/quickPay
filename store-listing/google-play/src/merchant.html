<!DOCTYPE html>
<!--
  Zapp Pay Merchant — Google Play store graphics
  ────────────────────────────────────────────────────────────
  Same frames and render pipeline as customer.html (see common.js):
    #shot-1 … #shot-7  phone screenshots  (540×960 CSS @2x → 1080×1920)
    #feature           feature graphic    (1024×500 CSS @1x)
    #icon              hi-res icon        (512×512 CSS @1x)

  The listing frame uses the website's blue "business" look so the two
  listings read apart; the in-phone UI stays as the app draws it (black
  glass, coral accent). The icon and the logo tile are coral, like the
  customer app — both launcher icons are the same coral bolt. Screens mirror merchant-app/src: DashboardScreen,
  GenerateQRScreen (+ CounterIncomingFeed), ConfirmTopupScreen,
  PayrollScreen, PayoutScreen. Copy from merchant-app/src/i18n/locales/en.json.
  Fee and commission figures use the defaults in functions/src/config/rates.ts
  (1% payment fee, 2% top-up commission) — re-check if config/rates changes.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zapp Pay Merchant Play graphics</title>
<link rel="stylesheet" href="common.css" />
<style>
  /* ── Listing frame: merchant blue ───────────────────── */
  .canvas.merchant { background: #0A0C12; }
  .canvas.merchant .bg {
    background:
      radial-gradient(var(--g1w, 480px) var(--g1h, 400px) at var(--g1x, 12%) var(--g1y, 4%), rgba(26,86,255,var(--g1a, 0.36)), transparent 70%),
      radial-gradient(var(--g2w, 420px) var(--g2h, 420px) at var(--g2x, 96%) var(--g2y, 60%), rgba(255,80,67,var(--g2a, 0.10)), transparent 70%),
      radial-gradient(540px 300px at 50% 108%, rgba(26,86,255,0.22), transparent 70%);
  }
  .merchant .eyebrow { color: #9DB8FF; background: rgba(26,86,255,0.18); border-color: rgba(26,86,255,0.42); }
  .merchant .eyebrow::before { background: #4D7CFF; box-shadow: 0 0 10px #4D7CFF; }
  .merchant .accent, .feature.merchant .accent {
    background: linear-gradient(100deg, #4D7CFF 0%, #7FA3FF 55%, #B4C8FF 100%);
    -webkit-background-clip: text; background-clip: text;
  }
  .merchant .phone {
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.16),
      inset 0 0 0 3px rgba(0,0,0,0.6),
      0 0 0 1px rgba(0,0,0,0.7),
      0 60px 120px rgba(0,0,0,0.7),
      0 0 90px rgba(26,86,255,0.16);
  }
  .feature.merchant { background: #0A0C12; }
  .feature.merchant .bg {
    background:
      radial-gradient(560px 420px at 8% 0%, rgba(26,86,255,0.38), transparent 70%),
      radial-gradient(520px 460px at 92% 100%, rgba(26,86,255,0.22), transparent 70%),
      radial-gradient(420px 420px at 74% 30%, rgba(255,80,67,0.12), transparent 70%);
  }

  /* ── Merchant app primitives (merchant-app/src) ─────── */
  .m-head { padding: 8px 24px 12px; }
  .m-head .top { min-height: 32px; margin-bottom: 8px; display: flex; align-items: center; }
  .m-head h2 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
  .m-head p { font-size: 15px; line-height: 22px; color: var(--dim); margin-top: 6px; }
  .m-label { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--faint); margin: 18px 0 8px; }
  .m-pill {
    height: 58px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; background: #fff; color: #000;
  }
  .m-pill.glass { background: var(--glass); border: 1px solid var(--glass-border); color: #fff; }
  .m-tx { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .m-tx + .m-tx { border-top: 1px solid rgba(255,255,255,0.08); }
  .m-tx .av {
    width: 42px; height: 42px; border-radius: 21px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
  }
  .m-tx .av.in { background: rgba(31,157,85,0.18); }
  .m-tx .av.out { background: rgba(255,255,255,0.08); }
  .m-tx .info { flex: 1; min-width: 0; }
  .m-tx .info b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .m-tx .info small { font-size: 12px; color: var(--faint); }
  .m-tx .amt { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; font-variant-numeric: tabular-nums; }
  .m-tx .amt.in { color: var(--green); }
  .m-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  .m-div { height: 1px; background: rgba(255,255,255,0.1); margin: 8px 0; }
</style>
<script src="qr.js"></script>
<script src="common.js"></script>
</head>
<body>
<div id="root"></div>

<script>
/* ── Merchant glyphs (components/icons/AuthIcons.tsx) ── */

  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V6a2 2 0 012-2h2"/><path d="M16 4h2a2 2 0 012 2v2"/><path d="M20 16v2a2 2 0 01-2 2h-2"/><path d="M8 20H6a2 2 0 01-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>`;

const successCheck = (s = 72) => `
  <div style="position:relative;width:${s}px;height:${s}px;margin:0 auto">

const coralGlow = (top = -120) =>
  `<div class="glow" style="width:360px;height:360px;left:7px;top:${top}px;opacity:0.2"></div>`;

/* ── Screens (374 × 832 CSS px) ──────────────────────── */

/* ── Frames ──────────────────────────────────────────── */
